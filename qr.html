<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>QR das mesas · XV Ana Luísa</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Jost:wght@300;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha512-ZDSPMa/JM1D+7kdg2x3BsruQ6T/JpJo3jWDWkCZsP+5yVyp1KfESqLI+7RqB5k24F7p2cV7i2YHh/890y6P6Sw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
/* Plaquinhas das mesas: 4 por folha A4, para imprimir e recortar.
   O endereço vem de ?url=..., ou do próprio site quando esta página está publicada junto dele. */
:root { --noite: #1a0b30; --ouro: #e3b33d; --ouro-claro: #f7dc8e; --lilas: #c9aef0; --perola: #fbf6ee; }
* { box-sizing: border-box; }
body { margin: 0; background: #e9e4f0; color: #1a0b30; font: 300 16px/1.5 "Jost", system-ui, sans-serif; }
.painel { max-width: 820px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 12px; }
.painel h1 { font: 500 1.4rem/1.2 "Cormorant Garamond", Georgia, serif; margin: 0; }
.painel label { font-size: .9rem; }
.linha { display: flex; gap: 8px; flex-wrap: wrap; }
.linha input { flex: 1 1 260px; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 1px solid #b9a8d6; font: inherit; }
.linha button { padding: 12px 20px; border-radius: 999px; border: 0; cursor: pointer; font: 500 1rem "Jost", sans-serif; background: var(--noite); color: var(--ouro-claro); }
.aviso { margin: 0; font-size: .85rem; color: #6a4d93; }
.folha { width: 210mm; max-width: 100%; margin: 0 auto 32px; display: grid; grid-template-columns: 1fr 1fr; gap: 0; background: #fff; }
.placa {
  aspect-ratio: 105 / 148.5; display: grid; justify-items: center; align-content: center; gap: 2.5mm; text-align: center;
  padding: 8mm; color: var(--perola); border: 1px dashed rgba(201,174,240,.35);
  background: radial-gradient(ellipse 80% 55% at 50% 38%, rgba(227,179,61,.18), transparent 70%), linear-gradient(180deg, #120724, var(--noite) 50%, #1f0d39);
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.placa .rotulo { font: 500 2.6mm/1 "Jost", sans-serif; letter-spacing: .22em; text-transform: uppercase; color: var(--lilas); }
.placa .xv { font: 500 3.6mm/1 "Cormorant Garamond", serif; letter-spacing: .5em; padding-left: .5em; color: var(--ouro-claro); }
.placa .nome { font: 400 13mm/1.1 "Great Vibes", cursive; color: var(--ouro-claro); margin: 0 0 1mm; }
.placa .qr { width: 42mm; aspect-ratio: 1; background: #fff; border-radius: 3mm; padding: 2.5mm; }
.placa .qr svg { display: block; width: 100%; height: 100%; }
.placa .chamada { font: italic 4.2mm/1.3 "Cormorant Garamond", serif; color: var(--lilas); max-width: 60mm; margin: 1mm 0 0; }
@page { size: A4; margin: 0; }
@media print {
  body { background: #fff; }
  .painel { display: none; }
  .folha { margin: 0; }
}
</style>
</head>
<body>
<div class="painel">
  <h1>QR code das mesas</h1>
  <label for="url">Endereço do site que o QR abre</label>
  <div class="linha">
    <input id="url" type="url" inputmode="url" placeholder="https://..." autocomplete="off">
    <button type="button" id="imprimir">Imprimir</button>
  </div>
  <p class="aviso" id="aviso"></p>
</div>
<div class="folha" id="folha"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const daUrl = new URLSearchParams(location.search).get("url");
  // publicado junto do site: o QR aponta para a página principal (mesma pasta)
  const doSite = /^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)
    ? new URL("./", location.href).href : "";
  $("url").value = daUrl || doSite;

  function montar() {
    const url = $("url").value.trim();
    if (!/^https?:\/\/\S+$/.test(url)) {
      $("folha").innerHTML = "";
      $("aviso").textContent = "Digite o endereço completo do site publicado (começando com https://).";
      return;
    }
    $("aviso").textContent = "Confira o QR com a câmera do celular antes de imprimir.";
    const qr = qrcode(0, "M"); qr.addData(url); qr.make();
    const svg = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    const placa = `<div class="placa">
      <span class="rotulo">Momentos inesquecíveis…</span>
      <span class="xv">XV ANOS</span>
      <p class="nome">Ana Luísa</p>
      <div class="qr" role="img" aria-label="QR code para ${url.replace(/"/g, "")}">${svg}</div>
      <p class="chamada">Aponte a câmera, fotografe e deixe sua lembrança na galeria.</p>
    </div>`;
    $("folha").innerHTML = placa.repeat(4);
  }
  $("url").addEventListener("input", montar);
  $("imprimir").onclick = () => { montar(); if ($("folha").innerHTML) print(); };
  montar();
})();
</script>
</body>
</html>
